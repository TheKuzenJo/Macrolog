<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<title>MacroLog</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MacroLog">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#090b0e;--card:#12161b;--card2:#171c22;--line:#252c34;--text:#f4f6f8;--muted:#8f9aa7;--accent:#7dd3fc;--green:#86efac;--orange:#fdba74;--pink:#f9a8d4;--red:#fca5a5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#17202a 0,#090b0e 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{border:0;color:inherit}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:25px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}.date{color:var(--muted);font-size:13px;margin-top:3px}
.iconbtn,.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer}.iconbtn{font-size:17px}.btn:active,.iconbtn:active,.fab:active,.nav button:active{transform:scale(.98)}
.nav{display:flex;background:#0b0f13;border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:13px;position:sticky;top:8px;z-index:4}.nav button{flex:1;background:none;padding:10px;border-radius:10px;color:var(--muted);cursor:pointer}.nav .active{background:var(--card2);color:var(--text);box-shadow:0 3px 12px #0005}
.view{display:none}.view.active{display:block}.hero{background:linear-gradient(145deg,#151a21,#101419);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:0 16px 40px #0005}.heroTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cal{font-size:42px;font-weight:850;letter-spacing:-1.7px}.cal small{font-size:15px;color:var(--muted);font-weight:500}.goalText{color:var(--muted);font-size:12px;margin-top:2px}.bar{height:7px;background:#242a31;border-radius:10px;margin:13px 0 17px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:10px;transition:.25s}.macrogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.macro{background:#0d1115;border:1px solid #20262d;border-radius:14px;padding:11px}.macro b{display:block;font-size:17px}.macro small{color:var(--muted);font-size:11px}.macro .mini{height:4px;background:#242a31;border-radius:5px;margin-top:8px;overflow:hidden}.macro .mini i{display:block;height:100%;width:0;border-radius:5px}.p b{color:var(--green)}.c b{color:var(--orange)}.f b{color:var(--pink)}.p .mini i{background:var(--green)}.c .mini i{background:var(--orange)}.f .mini i{background:var(--pink)}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px}.section h2{font-size:17px;margin:0}.section button{background:none;color:var(--accent);padding:5px;cursor:pointer}.subtle{color:var(--muted);font-size:12px}
.meal{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;overflow:hidden}.mealhead{padding:13px 14px;display:flex;justify-content:space-between;align-items:center}.mealname{font-weight:700}.mealcal{color:var(--muted);font-size:13px}.food{display:flex;justify-content:space-between;padding:11px 14px;border-top:1px solid #20262d;gap:10px}.foodname{font-size:14px}.foodmeta{color:var(--muted);font-size:12px;margin-top:3px}.foodright{text-align:right;white-space:nowrap}.foodright b{font-size:14px}.foodright small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.foodActions{display:flex;gap:5px;margin-left:auto}.tiny{padding:7px 9px;border-radius:9px;background:#202832;cursor:pointer}.empty{color:var(--muted);text-align:center;padding:25px 10px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:#061017;font-weight:850;border-radius:18px;padding:14px 22px;box-shadow:0 10px 30px #0008;z-index:5;cursor:pointer;white-space:nowrap}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}.overlay.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#101419;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{margin:0 0 15px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;background:#0b0f13;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.actions{display:flex;gap:8px;margin-top:8px}.actions .primary{flex:1;background:var(--accent);color:#061017;font-weight:800}.danger{color:var(--red)!important}.check{display:flex;align-items:center;gap:9px;background:#0c1014;border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:2px;font-size:13px}.check input{accent-color:var(--accent)}
.tabs{display:flex;background:#0b0f13;border:1px solid var(--line);padding:4px;border-radius:13px;margin-bottom:13px}.tabs button{flex:1;background:none;padding:9px;border-radius:9px;color:var(--muted);cursor:pointer}.tabs .active{background:var(--card2);color:var(--text)}
.notice{font-size:12px;color:var(--muted);line-height:1.45;background:#0c1014;border-radius:11px;padding:10px;margin-top:10px}.search{margin-bottom:10px}.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:7px}.listitem small{display:block;color:var(--muted);margin-top:3px}.listitem button{background:#202832;border-radius:10px;padding:8px 11px;cursor:pointer}.listitem .left{min-width:0}.listitem b{overflow-wrap:anywhere}
.weekHead{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 14px}.weekTitle{font-size:22px;font-weight:800}.weekRange{font-size:12px;color:var(--muted);margin-top:3px}.daycard{background:var(--card);border:1px solid var(--line);border-radius:17px;margin-bottom:9px;padding:14px;cursor:pointer;transition:.15s}.daycard.today{border-color:#3d6577;box-shadow:0 5px 20px #0003}.daycard.selected{outline:1px solid var(--accent)}.daytop{display:flex;justify-content:space-between;align-items:center;gap:10px}.dayname{font-weight:750}.daydate{color:var(--muted);font-size:12px;margin-top:3px}.daycal{text-align:right;font-weight:700}.daycal small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}.daybars{display:grid;gap:6px;margin-top:12px}.daybar{height:5px;background:#242a31;border-radius:5px;overflow:hidden}.daybar i{display:block;height:100%;width:0;border-radius:5px}.daymacro{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.selectedDay{background:#0d1115;border:1px dashed var(--line);border-radius:14px;padding:12px;margin-top:11px}
.historyday{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.historyday b{font-size:14px}.historyday span{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#eaf6fb;color:#071116;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px;max-width:560px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">Macro<span>Log</span></div><div class="date" id="today"></div></div><button class="iconbtn" id="settings">⚙︎</button></header>
<nav class="nav"><button id="navToday" class="active">Bugün</button><button id="navWeek">Hafta</button></nav>

<main id="todayView" class="view active">
<section class="hero">
  <div class="heroTop"><div><div class="cal" id="totalCal">0 <small>kcal</small></div><div class="goalText" id="calGoalText"></div></div></div>
  <div class="bar"><i id="calbar"></i></div>
  <div class="macrogrid">
    <div class="macro p"><b id="p">0 / 0 g</b><small>Protein</small><div class="mini"><i id="pbar"></i></div></div>
    <div class="macro c"><b id="c">0 / 0 g</b><small>Karbonhidrat</small><div class="mini"><i id="cbar"></i></div></div>
    <div class="macro f"><b id="f">0 / 0 g</b><small>Yağ</small><div class="mini"><i id="fbar"></i></div></div>
  </div>
</section>
<div class="section"><h2>Bugün</h2><button id="clearDay">Günü temizle</button></div>
<div id="meals"></div>
<div class="section"><h2>Hızlı ekle</h2><span class="subtle">Kayıtlı besin & yemek</span></div>
<div id="quickFoods"></div>
<div id="quickMeals"></div>
</main>

<main id="weekView" class="view">
  <div class="weekHead"><div><div class="weekTitle">Bu hafta</div><div class="weekRange" id="weekRange"></div></div></div>
  <div id="weekDays"></div>
</main>
</div>

<button class="fab" id="add">＋ Porsiyon ekle</button>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
const KEY='macrolog_v2';
const defaultState={settings:{calorieGoal:2500,proteinGoal:0,carbGoal:0,fatGoal:0},foods:[],mealPresets:[],days:{},lastCleanupWeek:''};
let state=load(), activeView='today', selectedDayKey=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{
    let raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!raw){
      const legacy=JSON.parse(localStorage.getItem('macrolog_v1')||'null');
      if(legacy){
        raw={...legacy,mealPresets:legacy.mealPresets||[],lastCleanupWeek:legacy.lastCleanupWeek||''};
      }else raw={};
    }
    const s={...clone(defaultState),...raw,settings:{...clone(defaultState.settings),...(raw.settings||{})}};
    if(!Array.isArray(s.foods))s.foods=[];
    if(!Array.isArray(s.mealPresets))s.mealPresets=[];
    if(!s.days||typeof s.days!=='object')s.days={};
    if(!s.settings.calorieGoal)s.settings.calorieGoal=2500;
    return s;
  }catch(e){return clone(defaultState)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function localDateKey(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function logicalDate(now=new Date()){
  const d=new Date(now);
  if(d.getHours()<2)d.setDate(d.getDate()-1);
  return d;
}
function todayKey(){return localDateKey(logicalDate())}
function dateFromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function mondayKey(k=todayKey()){
  const d=dateFromKey(k), day=d.getDay(), diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);return localDateKey(d);
}
function weekKeys(){
  const start=dateFromKey(mondayKey()), out=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(localDateKey(d))}
  return out;
}
function day(k=todayKey()){return state.days[k] ||= []}
function totals(items=day()){return items.reduce((a,x)=>{a.cal+=Number(x.cal)||0;a.p+=Number(x.p)||0;a.c+=Number(x.c)||0;a.f+=Number(x.f)||0;return a},{cal:0,p:0,c:0,f:0})}
function num(v){return Math.round((Number(v)||0)*100)/100}
function fmt(v){return Number(v||0).toLocaleString('tr-TR',{maximumFractionDigits:1})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function mealLabel(k){return ({Breakfast:'Kahvaltı',Lunch:'Öğle',Dinner:'Akşam',Snack:'Atıştırmalık'})[k]||k}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove('show'),1800)}

function cleanupOldWeek(){
  const wk=mondayKey();
  if(state.lastCleanupWeek===wk)return;
  const keep=new Set(weekKeys());
  Object.keys(state.days).forEach(k=>{if(!keep.has(k))delete state.days[k]});
  state.lastCleanupWeek=wk;save();
}
function render(){
  cleanupOldWeek();
  const logical=logicalDate();
  const key=todayKey(), t=totals(day(key)), g=state.settings;
  document.getElementById('today').textContent=logical.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('totalCal').innerHTML=`${fmt(t.cal)} <small>kcal</small>`;
  document.getElementById('calGoalText').textContent=`Hedef ${fmt(g.calorieGoal)} kcal · Gün 02:00'de değişir`;
  document.getElementById('p').textContent=`${fmt(t.p)} / ${fmt(g.proteinGoal)} g`;
  document.getElementById('c').textContent=`${fmt(t.c)} / ${fmt(g.carbGoal)} g`;
  document.getElementById('f').textContent=`${fmt(t.f)} / ${fmt(g.fatGoal)} g`;
  document.getElementById('calbar').style.width=Math.min(100,t.cal/(g.calorieGoal||1)*100)+'%';
  document.getElementById('pbar').style.width=Math.min(100,t.p/(g.proteinGoal||1)*100)+'%';
  document.getElementById('cbar').style.width=Math.min(100,t.c/(g.carbGoal||1)*100)+'%';
  document.getElementById('fbar').style.width=Math.min(100,t.f/(g.fatGoal||1)*100)+'%';
  renderMeals(key);renderQuick();
  if(activeView==='week')renderWeek();
}
function renderMeals(key){
  const groups={Breakfast:'Kahvaltı',Lunch:'Öğle',Dinner:'Akşam',Snack:'Atıştırmalık'};
  const html=Object.entries(groups).map(([k,n])=>{
    const xs=day(key).filter(x=>x.meal===k), mt=totals(xs);if(!xs.length)return '';
    return `<div class="meal"><div class="mealhead"><span class="mealname">${n}</span><span class="mealcal">${fmt(mt.cal)} kcal</span></div>${xs.map(x=>`<div class="food">
      <div><div class="foodname">${esc(x.name)}</div><div class="foodmeta">${x.grams?fmt(x.grams)+' g · ':''}${x.source==='preset'?'Kayıtlı yemek':x.source==='food'?'Kayıtlı besin':'Serbest porsiyon'}</div></div>
      <div class="foodright"><b>${fmt(x.cal)} kcal</b><small>P ${fmt(x.p)} · C ${fmt(x.c)} · F ${fmt(x.f)}</small></div>
      <div class="foodActions"><button class="tiny" onclick="editEntry('${key}','${x.id}')">✎</button><button class="tiny danger" onclick="deleteEntry('${key}','${x.id}')">×</button></div>
    </div>`).join('')}</div>`;
  }).join('');
  document.getElementById('meals').innerHTML=html||'<div class="empty">Bugün henüz bir şey eklenmedi.<br>＋ Porsiyon ekle ile başlayabilirsin.</div>';
}
function renderQuick(){
  const foods=state.foods.slice().reverse().slice(0,4), meals=state.mealPresets.slice().reverse().slice(0,4);
  document.getElementById('quickFoods').innerHTML=foods.length?foods.map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal / 100 g · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</small></div><button onclick="portionFood('${f.id}')">Ekle</button></div>`).join(''):'';
  document.getElementById('quickMeals').innerHTML=meals.length?meals.map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</small></div><button onclick="portionPreset('${f.id}')">Ekle</button></div>`).join(''):'';
}
function renderWeek(){
  const keys=weekKeys(), today=todayKey();
  const s=dateFromKey(keys[0]),e=dateFromKey(keys[6]);
  document.getElementById('weekRange').textContent=`${s.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})} – ${e.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}`;
  document.getElementById('weekDays').innerHTML=keys.map(k=>{
    const d=dateFromKey(k), t=totals(state.days[k]||[]), isToday=k===today, sel=k===selectedDayKey;
    const g=state.settings;
    return `<div class="daycard ${isToday?'today':''} ${sel?'selected':''}" onclick="selectWeekDay('${k}')">
      <div class="daytop"><div><div class="dayname">${d.toLocaleDateString('tr-TR',{weekday:'long'})}${isToday?' · Bugün':''}</div><div class="daydate">${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</div></div>
      <div class="daycal">${fmt(t.cal)} kcal<small>${(state.days[k]||[]).length} kayıt</small></div></div>
      <div class="daybars"><div class="daybar"><i style="width:${Math.min(100,t.cal/(g.calorieGoal||1)*100)}%;background:var(--accent)"></i></div></div>
      <div class="daymacro"><span>P ${fmt(t.p)} / ${fmt(g.proteinGoal)} g</span><span>C ${fmt(t.c)} · F ${fmt(t.f)}</span></div>
      ${sel?renderSelectedDay(k):''}
    </div>`;
  }).join('');
}
function renderSelectedDay(k){
  const xs=state.days[k]||[];
  return `<div class="selectedDay" onclick="event.stopPropagation()"><div class="section" style="margin:0 0 7px"><h2>${dateFromKey(k).toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</h2><button onclick="openDayEditor('${k}')">Düzenle</button></div>
  ${xs.length?xs.map(x=>`<div class="historyday"><b>${esc(x.name)}</b><span>${fmt(x.cal)} kcal · P ${fmt(x.p)} · C ${fmt(x.c)} · F ${fmt(x.f)}</span></div>`).join(''):'<div class="subtle" style="padding:10px 0">Kayıt yok.</div>'}</div>`;
}
function selectWeekDay(k){selectedDayKey=k;renderWeek()}
function openDayEditor(k){
  openSheet(`<h3>${dateFromKey(k).toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</h3>
  <div id="dayEditList"></div><div class="actions"><button class="btn primary" onclick="openAdd('${k}')">＋ Bu güne ekle</button></div>`);
  const xs=state.days[k]||[];
  document.getElementById('dayEditList').innerHTML=xs.length?xs.map(x=>`<div class="listitem"><div class="left"><b>${esc(x.name)}</b><small>${fmt(x.cal)} kcal · ${mealLabel(x.meal)}</small></div><div><button onclick="editEntry('${k}','${x.id}')">✎</button> <button class="danger" onclick="deleteEntry('${k}','${x.id}',true)">×</button></div></div>`).join(''):'<div class="empty">Bu günde kayıt yok.</div>';
}

function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};

document.getElementById('add').onclick=()=>openAdd(todayKey());
function openAdd(targetKey=todayKey()){
  openSheet(`<h3>Porsiyon ekle</h3><div class="tabs"><button class="active" id="tabFood" onclick="switchAddTab('food')">Kayıtlı besin</button><button id="tabPreset" onclick="switchAddTab('preset')">Porsiyon yemek</button><button id="tabCustom" onclick="switchAddTab('custom')">Serbest</button></div><div id="addBody"></div>`);
  switchAddTab('food',targetKey);
}
function switchAddTab(tab,targetKey=todayKey()){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  const id=tab==='food'?'tabFood':tab==='preset'?'tabPreset':'tabCustom';document.getElementById(id)?.classList.add('active');
  if(tab==='food')renderFoodChooser(targetKey);if(tab==='preset')renderPresetChooser(targetKey);if(tab==='custom')renderCustom(targetKey);
}
function renderFoodChooser(targetKey){
  document.getElementById('addBody').innerHTML=`<div class="field"><label>Besin ara</label><input id="findFood" placeholder="Örn. tavuk, yoğurt..." autocomplete="off"></div><div id="foodResults"></div>
  <div class="notice">Bu sistem kayıtlı besinleri <b>100 g</b> üzerinden hesaplar. Kendi besin verini değiştirmek için Ayarlar değil, Kayıtlı besinler yöneticisini kullan.</div>
  <div class="actions"><button class="btn" onclick="manageFoods()">＋ Kayıtlı besinleri yönet</button></div>`;
  renderFoodResults(targetKey);document.getElementById('findFood').oninput=()=>renderFoodResults(targetKey);
}
function renderFoodResults(targetKey){
  const q=(document.getElementById('findFood')?.value||'').toLowerCase();
  const fs=state.foods.filter(f=>f.name.toLowerCase().includes(q)).slice().reverse();
  document.getElementById('foodResults').innerHTML=fs.map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal / 100 g</small></div><button onclick="portionFood('${f.id}','${targetKey}')">Ekle</button></div>`).join('')||'<div class="empty">Besin bulunamadı.</div>';
}
function renderPresetChooser(targetKey){
  const ps=state.mealPresets.slice().reverse();
  document.getElementById('addBody').innerHTML=ps.length?ps.map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</small></div><button onclick="portionPreset('${f.id}','${targetKey}')">Ekle</button></div>`).join(''):`<div class="empty">Henüz kayıtlı porsiyon yemek yok.</div>`;
  document.getElementById('addBody').innerHTML+=`<div class="actions"><button class="btn" onclick="managePresets()">＋ Porsiyon yemekleri yönet</button></div>`;
}
function renderCustom(targetKey){
  document.getElementById('addBody').innerHTML=`<div class="notice">Burada <b>100 g hesabı yok</b>. O an yediğin porsiyonun toplam değerlerini doğrudan gir.</div>
  <div class="field"><label>Yemek adı</label><input id="cn" placeholder="Örn. Ev yapımı omlet"></div>
  <div class="row">${[['ck','Kalori (kcal)'],['cp','Protein (g)'],['cc','Karbonhidrat (g)'],['cf','Yağ (g)']].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="number" min="0" step="0.1"></div>`).join('')}</div>
  <div class="tabs">${['Breakfast','Lunch','Dinner','Snack'].map((x,i)=>`<button class="${i===0?'active':''}" data-meal="${x}" onclick="chooseMeal(this)">${mealLabel(x)}</button>`).join('')}</div>
  <label class="check"><input id="savePreset" type="checkbox" onchange="document.getElementById('presetNameWrap').style.display=this.checked?'block':'none'"> Bu yemeği porsiyon yemek preset'i olarak da kaydet</label>
  <div class="field" id="presetNameWrap" style="display:none;margin-top:9px"><label>Preset adı</label><input id="presetName" placeholder="Örn. Benim omletim"></div>
  <div class="actions"><button class="btn" onclick="closeSheet()">İptal</button><button class="btn primary" onclick="addCustom('${targetKey}')">Ekle</button></div>`;
}
function chooseMeal(el){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function selectedMeal(){return document.querySelector('#addBody .tabs .active')?.dataset.meal||'Breakfast'}
function addCustom(targetKey){
  const name=document.getElementById('cn').value.trim(),cal=num(document.getElementById('ck').value),p=num(document.getElementById('cp').value),c=num(document.getElementById('cc').value),f=num(document.getElementById('cf').value);
  if(!name)return alert('Bir yemek adı gir.');if(!cal&&!p&&!c&&!f)return alert('En az bir besin değeri gir.');
  day(targetKey).push({id:uid(),name,grams:null,cal,p,c,f,meal:selectedMeal(),source:'custom'}); 
  if(document.getElementById('savePreset').checked){const pn=(document.getElementById('presetName').value.trim()||name);state.mealPresets.push({id:uid(),name:pn,kcal:cal,p,c,f})}
  save();closeSheet();render();showToast('Porsiyon eklendi');
}
function portionFood(id,targetKey=todayKey()){
  const f=state.foods.find(x=>x.id===id);if(!f)return;
  openSheet(`<h3>${esc(f.name)}</h3><div class="field"><label>Gramaj</label><input id="grams" type="number" min="0" step="1" value="100" autofocus></div>
  <div class="tabs">${['Breakfast','Lunch','Dinner','Snack'].map((x,i)=>`<button class="${i===0?'active':''}" data-meal="${x}" onclick="chooseMeal(this)">${mealLabel(x)}</button>`).join('')}</div><div class="notice" id="preview"></div>
  <div class="actions"><button class="btn" onclick="closeSheet()">İptal</button><button class="btn primary" onclick="addFoodPortion('${f.id}','${targetKey}')">Ekle</button></div>`);
  document.getElementById('grams').oninput=()=>previewFood(f);previewFood(f);
}
function previewFood(f){const g=Number(document.getElementById('grams').value)||0;document.getElementById('preview').innerHTML=`<b>${fmt(f.kcal*g/100)} kcal</b> · P ${fmt(f.p*g/100)} g · C ${fmt(f.c*g/100)} g · F ${fmt(f.f*g/100)} g`}
function addFoodPortion(id,targetKey){
  const f=state.foods.find(x=>x.id===id),g=Number(document.getElementById('grams').value)||0;if(!g)return;
  const r=g/100;day(targetKey).push({id:uid(),foodId:id,name:f.name,grams:g,cal:num(f.kcal*r),p:num(f.p*r),c:num(f.c*r),f:num(f.f*r),meal:selectedMeal(),source:'food'});save();closeSheet();render();showToast('Besin eklendi');
}
function portionPreset(id,targetKey=todayKey()){
  const f=state.mealPresets.find(x=>x.id===id);if(!f)return;
  openSheet(`<h3>${esc(f.name)}</h3><div class="notice"><b>Hazır porsiyon</b><br>${fmt(f.kcal)} kcal · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</div>
  <div class="tabs">${['Breakfast','Lunch','Dinner','Snack'].map((x,i)=>`<button class="${i===0?'active':''}" data-meal="${x}" onclick="chooseMeal(this)">${mealLabel(x)}</button>`).join('')}</div>
  <div class="actions"><button class="btn" onclick="closeSheet()">İptal</button><button class="btn primary" onclick="addPresetPortion('${f.id}','${targetKey}')">Ekle</button></div>`);
}
function addPresetPortion(id,targetKey){
  const f=state.mealPresets.find(x=>x.id===id);if(!f)return;
  day(targetKey).push({id:uid(),presetId:id,name:f.name,grams:null,cal:f.kcal,p:f.p,c:f.c,f:f.f,meal:selectedMeal(),source:'preset'});save();closeSheet();render();showToast('Porsiyon yemek eklendi');
}

function editEntry(k,id){
  const x=(state.days[k]||[]).find(a=>a.id===id);if(!x)return;
  openSheet(`<h3>Kaydı düzenle</h3><div class="field"><label>Yemek adı</label><input id="en" value="${esc(x.name)}"></div>
  <div class="row">${[['ek','Kalori (kcal)','cal'],['ep','Protein (g)','p'],['ec','Karbonhidrat (g)','c'],['ef','Yağ (g)','f']].map(([id,l,key])=>`<div class="field"><label>${l}</label><input id="${id}" type="number" min="0" step="0.1" value="${x[key]??0}"></div>`).join('')}</div>
  <div class="field"><label>Öğün</label><select id="em">${['Breakfast','Lunch','Dinner','Snack'].map(m=>`<option value="${m}" ${x.meal===m?'selected':''}>${mealLabel(m)}</option>`).join('')}</select></div>
  <div class="actions"><button class="btn" onclick="closeSheet()">İptal</button><button class="btn primary" onclick="saveEntry('${k}','${id}')">Kaydet</button></div>`);
}
function saveEntry(k,id){
  const x=(state.days[k]||[]).find(a=>a.id===id);if(!x)return;
  const name=document.getElementById('en').value.trim();if(!name)return alert('Bir isim gir.');
  Object.assign(x,{name,cal:num(document.getElementById('ek').value),p:num(document.getElementById('ep').value),c:num(document.getElementById('ec').value),f:num(document.getElementById('ef').value),meal:document.getElementById('em').value});
  save();closeSheet();render();if(activeView==='week'){selectedDayKey=k;renderWeek()}showToast('Kayıt güncellendi');
}
function deleteEntry(k,id,reopen=false){
  if(!confirm('Bu kayıt silinsin mi?'))return;
  state.days[k]=(state.days[k]||[]).filter(x=>x.id!==id);if(!state.days[k].length)delete state.days[k];save();render();
  if(reopen)openDayEditor(k);showToast('Kayıt silindi');
}

function manageFoods(){
  openSheet(`<h3>Kayıtlı besinler</h3><div class="actions"><button class="btn primary" onclick="newFood()">＋ Yeni besin</button></div><div id="manageList" style="margin-top:12px"></div>`);
  renderManageFoods();
}
function renderManageFoods(){
  const el=document.getElementById('manageList');if(!el)return;
  el.innerHTML=state.foods.slice().reverse().map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal / 100 g · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</small></div><div><button onclick="newFood('${f.id}')">✎</button> <button class="danger" onclick="deleteFood('${f.id}')">×</button></div></div>`).join('')||'<div class="empty">Henüz kayıtlı besin yok.</div>';
}
function newFood(editId=''){
  const f=editId?state.foods.find(x=>x.id===editId):null;
  openSheet(`<h3>${f?'Besini düzenle':'Yeni besin'}</h3><div class="field"><label>İsim</label><input id="fn" value="${esc(f?.name||'')}"></div><div class="notice">Değerleri <b>100 gram</b> üzerinden gir.</div>
  <div class="row">${[['fk','Kalori (kcal)','kcal'],['fp','Protein (g)','p'],['fc','Karbonhidrat (g)','c'],['ff','Yağ (g)','f']].map(([id,l,k])=>`<div class="field"><label>${l}</label><input id="${id}" type="number" min="0" step="0.1" value="${f?.[k]??''}"></div>`).join('')}</div>
  <div class="actions"><button class="btn" onclick="manageFoods()">İptal</button><button class="btn primary" onclick="saveFood('${editId}')">Kaydet</button></div>`);
}
function saveFood(id){
  const name=document.getElementById('fn').value.trim();if(!name)return alert('Bir isim gir.');
  const obj={id:id||uid(),name,kcal:num(document.getElementById('fk').value),p:num(document.getElementById('fp').value),c:num(document.getElementById('fc').value),f:num(document.getElementById('ff').value)};
  if(id)state.foods=state.foods.map(x=>x.id===id?obj:x);else state.foods.push(obj);save();manageFoods();render();showToast('Besin kaydedildi');
}
function deleteFood(id){if(confirm('Bu besini silmek istediğine emin misin? Geçmiş kayıtların değerleri korunur.')){state.foods=state.foods.filter(x=>x.id!==id);save();manageFoods();render()}}
function managePresets(){
  openSheet(`<h3>Porsiyon yemekler</h3><div class="actions"><button class="btn primary" onclick="renderCustomPresetOnly()">＋ Yeni preset</button></div><div id="presetList" style="margin-top:12px"></div>`);
  renderManagePresets();
}
function renderManagePresets(){
  const el=document.getElementById('presetList');if(!el)return;
  el.innerHTML=state.mealPresets.slice().reverse().map(f=>`<div class="listitem"><div class="left"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal · P ${fmt(f.p)} · C ${fmt(f.c)} · F ${fmt(f.f)}</small></div><div><button onclick="editPreset('${f.id}')">✎</button> <button class="danger" onclick="deletePreset('${f.id}')">×</button></div></div>`).join('')||'<div class="empty">Henüz preset yok.</div>';
}
function renderCustomPresetOnly(){
  openSheet(`<h3>Yeni porsiyon yemek</h3><div class="notice">Bu ayrı bir sistemdir: <b>100 g hesabı yapılmaz</b>; preset her eklenişinde aynı toplam değerlerle bir porsiyon olarak kaydedilir.</div>
  <div class="field"><label>Preset adı</label><input id="pn" placeholder="Örn. Benim omletim"></div>
  <div class="row">${[['pk','Kalori (kcal)'],['pp','Protein (g)'],['pc','Karbonhidrat (g)'],['pf','Yağ (g)']].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="number" min="0" step="0.1"></div>`).join('')}</div>
  <div class="actions"><button class="btn" onclick="managePresets()">İptal</button><button class="btn primary" onclick="savePreset()">Kaydet</button></div>`);
}
function savePreset(){
  const name=document.getElementById('pn').value.trim();if(!name)return alert('Bir isim gir.');
  state.mealPresets.push({id:uid(),name,kcal:num(document.getElementById('pk').value),p:num(document.getElementById('pp').value),c:num(document.getElementById('pc').value),f:num(document.getElementById('pf').value)});
  save();managePresets();render();showToast('Preset kaydedildi');
}
function editPreset(id){
  const f=state.mealPresets.find(x=>x.id===id);if(!f)return;
  openSheet(`<h3>Preset düzenle</h3><div class="field"><label>İsim</label><input id="pn" value="${esc(f.name)}"></div>
  <div class="row">${[['pk','Kalori (kcal)','kcal'],['pp','Protein (g)','p'],['pc','Karbonhidrat (g)','c'],['pf','Yağ (g)','f']].map(([id,l,k])=>`<div class="field"><label>${l}</label><input id="${id}" type="number" min="0" step="0.1" value="${f[k]}"></div>`).join('')}</div>
  <div class="actions"><button class="btn" onclick="managePresets()">İptal</button><button class="btn primary" onclick="updatePreset('${id}')">Kaydet</button></div>`);
}
function updatePreset(id){
  const f=state.mealPresets.find(x=>x.id===id);if(!f)return;
  Object.assign(f,{name:document.getElementById('pn').value.trim()||f.name,kcal:num(document.getElementById('pk').value),p:num(document.getElementById('pp').value),c:num(document.getElementById('pc').value),f:num(document.getElementById('pf').value)});
  save();managePresets();render();
}
function deletePreset(id){if(confirm('Bu preset silinsin mi? Geçmiş porsiyon kayıtları korunur.')){state.mealPresets=state.mealPresets.filter(x=>x.id!==id);save();managePresets();render()}}
function clearCurrentDay(){const k=todayKey();if((state.days[k]||[]).length&&confirm('Bugünün kayıtları silinsin mi?')){delete state.days[k];save();render();showToast('Gün temizlendi')}}

function settings(){
  const g=state.settings;
  openSheet(`<h3>Günlük hedefler</h3><div class="notice">Hedefler sadece ilerlemeyi göstermek için kullanılır; uygulama sana hedef önermiyor.</div>
  <div class="row">${[['goal','Kalori (kcal)',g.calorieGoal],['pg','Protein (g)',g.proteinGoal],['cg','Karbonhidrat (g)',g.carbGoal],['fg','Yağ (g)',g.fatGoal]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" type="number" min="0" step="1" value="${x[2]||0}"></div>`).join('')}</div>
  <div class="actions"><button class="btn" onclick="closeSheet()">İptal</button><button class="btn primary" onclick="saveSettings()">Kaydet</button></div>
  <div class="section"><h2>Yönetim</h2></div><div class="actions"><button class="btn" onclick="manageFoods()">Kayıtlı besinler</button><button class="btn" onclick="managePresets()">Porsiyon yemekler</button></div>
  <div class="actions"><button class="btn" onclick="exportData()">Yedeği dışa aktar</button><button class="btn" onclick="importData()">Yedekten içe aktar</button></div>
  <div class="notice">Hafta her pazartesi yeniden başlar. Önceki haftanın günlük kayıtları otomatik silinir. Kayıtlı besinler, presetler ve hedefler kalır. Yedek almak, tarayıcı verileri temizlenmesine karşı koruma sağlar.</div>`);
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`macrolog-yedek-${todayKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='application/json';
  input.onchange=()=>{
    const file=input.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const raw=JSON.parse(reader.result);
        if(!raw||typeof raw!=='object'||!raw.settings||!raw.days)throw new Error();
        state={...clone(defaultState),...raw,settings:{...clone(defaultState.settings),...(raw.settings||{})}};
        state.foods=Array.isArray(state.foods)?state.foods:[];state.mealPresets=Array.isArray(state.mealPresets)?state.mealPresets:[];
        save();render();showToast('Yedek içe aktarıldı');closeSheet();
      }catch(e){alert('Bu dosya geçerli bir MacroLog yedeği değil.')}
    };reader.readAsText(file);
  };input.click();
}
function saveSettings(){
  state.settings.calorieGoal=num(document.getElementById('goal').value)||2500;
  state.settings.proteinGoal=num(document.getElementById('pg').value);
  state.settings.carbGoal=num(document.getElementById('cg').value);
  state.settings.fatGoal=num(document.getElementById('fg').value);
  save();closeSheet();render();showToast('Hedefler güncellendi');
}
document.getElementById('settings').onclick=settings;
document.getElementById('clearDay').onclick=clearCurrentDay;
document.getElementById('navToday').onclick=()=>{activeView='today';document.getElementById('navToday').classList.add('active');document.getElementById('navWeek').classList.remove('active');document.getElementById('todayView').classList.add('active');document.getElementById('weekView').classList.remove('active');render()};
document.getElementById('navWeek').onclick=()=>{activeView='week';document.getElementById('navWeek').classList.add('active');document.getElementById('navToday').classList.remove('active');document.getElementById('weekView').classList.add('active');document.getElementById('todayView').classList.remove('active');renderWeek()};
setInterval(()=>{if(todayKey()!==lastRenderedKey){lastRenderedKey=todayKey();render()}},30000);
let lastRenderedKey=todayKey();
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script>
</body>
</html>
